# Local development stack. Works without .env: defaults below match application-dev.yaml.
# Every port is bound to 127.0.0.1; the credentials are throwaway dev values.
name: sizy-lift-backend

services:
  postgres:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: sizylift
      POSTGRES_USER: ${DB_USERNAME:-sizylift}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sizylift-dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Keycloak keeps its data in a separate PostgreSQL instance, isolated from the application database.
  keycloak-postgres:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-dev}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    # Development mode: plain HTTP and no theme caching. The realm is imported only if it does not exist yet.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-dev}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      GOOGLE_IDP_ENABLED: ${GOOGLE_IDP_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_IDP_ENABLED: ${FACEBOOK_IDP_ENABLED:-false}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak/realm-sizylift.json:/opt/keycloak/data/import/realm-sizylift.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      # The image has no curl; query the readiness endpoint through bash (503 until ready).
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Catches Keycloak e-mails (verification, password reset) locally: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # OpenTelemetry collector + Prometheus + Tempo + Loki + Grafana in one container for local development.
  # The backend sends OTLP to localhost:4318; Grafana: http://localhost:3000 (anonymous admin, local only).
  otel-lgtm:
    image: grafana/otel-lgtm:0.36.0@sha256:57c04cbd8e7022f32bb84c4ac005d79baf8b08e2c5be44facf11f5f1f9944ba2
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - otel-lgtm-data:/data

volumes:
  postgres-data:
  keycloak-postgres-data:
  otel-lgtm-data:
