<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Приглашение недействительно — SizyLift</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --card: #fff; --text: #1b1b1b; --muted: #5f6368; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --card: #1e1e1e; --text: #f1f1f1; --muted: #a0a4a8; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { box-sizing: border-box; width: 100%; max-width: 420px; margin: 16px; padding: 28px 24px;
         background: var(--card); border-radius: 16px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Приглашение недействительно</h1>
  <p>Ссылка уже использована, отозвана или устарела (она действует 7 дней). Попросите тренера прислать новую.</p>
</main>
</body>
</html>
