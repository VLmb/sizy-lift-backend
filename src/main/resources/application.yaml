# Settings shared by every environment. Environment-specific values live in
# application-dev.yaml and application-prod.yaml; activate one with SPRING_PROFILES_ACTIVE.
spring:
  application:
    name: sizy-lift-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: sizylift
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    liquibase-schema: public
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens must be issued by the Keycloak realm ("iss", set per profile) for this API ("aud").
          # With jwk-set-uri set, signing keys are fetched lazily, so startup does not depend on Keycloak.
          audiences: sizylift-api

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
