# Settings shared by every environment. Environment-specific values live in
# application-dev.yaml and application-prod.yaml; activate one with SPRING_PROFILES_ACTIVE.
spring:
  application:
    name: sizy-lift-backend
  threads:
    # Long outbound calls (AI import, Expo Push) wait on virtual threads instead of platform threads.
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    liquibase-schema: public
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens must be issued by the Keycloak realm ("iss", set per profile) for this API ("aud").
          # With jwk-set-uri set, signing keys are fetched lazily, so startup does not depend on Keycloak.
          audiences: sizylift-api

sizylift:
  notifications:
    # Push via Expo (ADR-0009). Off in dev and tests: notifications pile up in the outbox unsent.
    enabled: false
    send-interval: 5s
    receipts-interval: 15m
    expo:
      url: https://exp.host/--/api/v2/push
      access-token: ""
      connect-timeout: 5s
      read-timeout: 15s
  imports:
    # AI program import (ADR-0008). DeepSeek key comes from DEEPSEEK_API_KEY in production.
    max-input-chars: 20000
    max-file-bytes: 1048576
    max-sheets: 10
    max-cells: 2000
    max-rounds: 3
    daily-limit: 20
    concurrent-per-user: 2
    model-concurrency: 8
    model-wait: 20s
    session-ttl: 24h
    model:
      url: https://api.deepseek.com
      name: deepseek-flash
      api-key: ""
      max-tokens: 16000
      connect-timeout: 5s
      read-timeout: 60s
      retry-pause: 2s
    sheets:
      connect-timeout: 5s
      read-timeout: 15s
      max-redirects: 3

server:
  port: 8080
  shutdown: graceful

management:
  # Telemetry goes to an OpenTelemetry collector over OTLP/HTTP (addresses per profile):
  # metrics via Micrometer, traces via Micrometer Tracing, logs via the Logback appender.
  opentelemetry:
    resource-attributes:
      service.namespace: sizylift
  otlp:
    metrics:
      export:
        step: 30s
  metrics:
    distribution:
      # Lets Grafana compute latency percentiles across instances.
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
