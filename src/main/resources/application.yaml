# Settings shared by every environment. Environment-specific values live in
# application-dev.yaml and application-prod.yaml; activate one with SPRING_PROFILES_ACTIVE.
spring:
  application:
    name: sizy-lift-backend
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    liquibase-schema: public
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens must be issued by the Keycloak realm ("iss", set per profile) for this API ("aud").
          # With jwk-set-uri set, signing keys are fetched lazily, so startup does not depend on Keycloak.
          audiences: sizylift-api

sizylift:
  web:
    # CORS для веба на отдельном адресе. В production веб на том же домене, что и API, поэтому пусто.
    allowed-origins: []
  notifications:
    # Push через Expo (ADR-0009). В dev и тестах выключено: уведомления копятся в outbox без отправки.
    enabled: false
    send-interval: 5s
    receipts-interval: 15m
    expo:
      url: https://exp.host/--/api/v2/push
      access-token: ""
      connect-timeout: 5s
      read-timeout: 15s

server:
  port: 8080
  shutdown: graceful

management:
  # Telemetry goes to an OpenTelemetry collector over OTLP/HTTP (addresses per profile):
  # metrics via Micrometer, traces via Micrometer Tracing, logs via the Logback appender.
  opentelemetry:
    resource-attributes:
      service.namespace: sizylift
  otlp:
    metrics:
      export:
        step: 30s
  metrics:
    distribution:
      # Lets Grafana compute latency percentiles across instances.
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
