# Settings shared by every environment. Environment-specific values live in
# application-dev.yaml and application-prod.yaml; activate one with SPRING_PROFILES_ACTIVE.
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: sizy-lift-backend
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    liquibase-schema: public
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens must be issued by the Keycloak realm ("iss", set per profile) for this API ("aud").
          # With jwk-set-uri set, signing keys are fetched lazily, so startup does not depend on Keycloak.
          audiences: sizylift-api

sizylift:
  imports:
    enabled: false
    deepseek:
      api-key: ""
      url: https://api.deepseek.com
      model: deepseek-flash
      timeout: 5m
  admin:
    keycloak-url: ""
    keycloak-client-id: ""
    keycloak-client-secret: ""
    prometheus-url: ""
    runtime-url: ""
  account-deletion:
    enabled: false
    admin-url: ""
    client-id: ""
    client-secret: ""
  web:
    # CORS для веба на отдельном адресе. В production веб на том же домене, что и API, поэтому пусто.
    allowed-origins: []
  coach-workspace:
    # «Сегодня» для «Входящих» и задач тренера; ежедневная задача ищет пропущенные тренировки и конец программ.
    zone: Europe/Moscow
    daily-cron: "0 17 4 * * *"
  video:
    # Видео подходов и техники (ADR-0012). Адрес и ключи хранилища — по профилям.
    upload-url-ttl: 15m
    view-url-ttl: 10m
    max-size-bytes: 26214400
    max-preview-size-bytes: 204800
    max-duration: 60s
    quota:
      set-bytes: 314572800
      technique-bytes: 1073741824
    bucket-limit-bytes: 8589934592
    pending-ttl: 24h
    cleanup-cron: "0 47 4 * * *"
    removal-interval: 1m
  notifications:
    # Push через Expo (ADR-0009). В dev и тестах выключено: уведомления копятся в outbox без отправки.
    enabled: false
    send-interval: 5s
    receipts-interval: 15m
    expo:
      url: https://exp.host/--/api/v2/push
      access-token: ""
      connect-timeout: 5s
      read-timeout: 15s

server:
  port: 8080
  shutdown: graceful

management:
  # Telemetry goes to an OpenTelemetry collector over OTLP/HTTP (addresses per profile):
  # metrics via Micrometer, traces via Micrometer Tracing, logs via the Logback appender.
  opentelemetry:
    resource-attributes:
      service.namespace: sizylift
  otlp:
    metrics:
      export:
        step: 30s
  metrics:
    distribution:
      # Lets Grafana compute latency percentiles across instances.
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
