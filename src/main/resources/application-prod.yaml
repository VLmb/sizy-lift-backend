# Production. Every environment-specific value comes from the environment and has no default:
# a missing variable stops the application at startup instead of silently using a dev value.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Public HTTPS address of the realm; must equal "iss" in tokens the app receives.
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          # Internal address is fine here, e.g. http://keycloak:8080/realms/sizylift/protocol/openid-connect/certs
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

sizylift:
  admin:
    keycloak-url: ${KEYCLOAK_ADMIN_URL}
    keycloak-client-id: ${KEYCLOAK_ADMIN_READ_CLIENT_ID}
    keycloak-client-secret: ${KEYCLOAK_ADMIN_READ_CLIENT_SECRET}
    prometheus-url: ${ADMIN_PROMETHEUS_URL}
    runtime-url: ${ADMIN_RUNTIME_URL}
  account-deletion:
    enabled: ${ACCOUNT_DELETION_ENABLED}
    admin-url: ${KEYCLOAK_ADMIN_URL}
    client-id: ${KEYCLOAK_DELETION_CLIENT_ID}
    client-secret: ${KEYCLOAK_DELETION_CLIENT_SECRET}
  web:
    # Адрес веб-версии (Origin), с которого браузер вызывает API, например https://example.com.
    # Несколько адресов — через запятую.
    allowed-origins: ${WEB_ALLOWED_ORIGINS}
  notifications:
    enabled: true
    expo:
      # Expo "enhanced push security" access token; requests without it are rejected.
      access-token: ${EXPO_ACCESS_TOKEN}

server:
  # TLS is terminated by the reverse proxy; trust its X-Forwarded-* headers.
  forward-headers-strategy: framework

management:
  # OpenTelemetry collector inside the Docker network, e.g. http://otel-lgtm:4318
  opentelemetry:
    resource-attributes:
      deployment.environment.name: prod
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT}/v1/metrics
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  # Actuator listens on a separate port that the reverse proxy does not expose.
  server:
    port: 8081
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
