# Integration tests: the database and, where needed, Keycloak come from Testcontainers
# through @DynamicPropertySource. Token validation tests override these addresses.
spring:
  # Каждый кэшированный контекст тестов держит свой пул к одной базе: без ограничения на полном прогоне
  # PostgreSQL отвечает «too many clients» (см. и max_connections в PostgresIntegrationTest).
  datasource:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak.test/realms/sizylift
          jwk-set-uri: http://keycloak.test/realms/sizylift/protocol/openid-connect/certs
management:
  # No collector in tests; meters are still recorded in the in-memory registry.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false
  logging:
    export:
      otlp:
        enabled: false
sizylift:
  video:
    browser:
      processing:
        # Перекодирование в тестах запускается вызовом processWaiting(): фоновый проход другого контекста
        # иначе забирает ролик посреди проверки.
        poll-interval: 1h
  web:
    allowed-origins:
      - http://web.test
