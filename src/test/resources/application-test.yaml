# Integration tests: the database and, where needed, Keycloak come from Testcontainers
# through @DynamicPropertySource. Token validation tests override these addresses.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak.test/realms/sizylift
          jwk-set-uri: http://keycloak.test/realms/sizylift/protocol/openid-connect/certs
management:
  # No collector in tests; meters are still recorded in the in-memory registry.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false
  logging:
    export:
      otlp:
        enabled: false
